apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotraderx-postgres
  labels:
    app: autotraderx
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autotraderx
      component: postgres
  template:
    metadata:
      labels:
        app: autotraderx
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: autotraderx-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autotraderx-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: autotraderx
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: autotraderx-postgres
  labels:
    app: autotraderx
    component: postgres
spec:
  selector:
    app: autotraderx
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
