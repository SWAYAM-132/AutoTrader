apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotraderx-frontend
  labels:
    app: autotraderx
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autotraderx
      component: frontend
  template:
    metadata:
      labels:
        app: autotraderx
        component: frontend
    spec:
      containers:
        - name: frontend
          image: autotraderx-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://autotraderx-backend:8000/api/v1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: autotraderx-frontend
  labels:
    app: autotraderx
    component: frontend
spec:
  selector:
    app: autotraderx
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
