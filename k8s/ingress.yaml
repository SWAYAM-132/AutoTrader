apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autotraderx-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # For AWS ALB Ingress Controller, use:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: nginx
  rules:
    - host: autotraderx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: autotraderx-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autotraderx-frontend
                port:
                  number: 3000
