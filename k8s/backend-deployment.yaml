apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotraderx-backend
  labels:
    app: autotraderx
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autotraderx
      component: backend
  template:
    metadata:
      labels:
        app: autotraderx
        component: backend
    spec:
      containers:
        - name: backend
          image: autotraderx-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: autotraderx-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autotraderx-backend
  labels:
    app: autotraderx
    component: backend
spec:
  selector:
    app: autotraderx
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
